version: "3.8"

volumes:
  data-mysql:

services:
  mysql:
    image: mysql:8.0
    volumes:
      - data-mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=udefinitions
    ports:
      - "3306:3306"
    healthcheck:
      test:
        ["CMD", "mysql", "-u", "root", "-proot", "--execute", "SHOW DATABASES;"]
      interval: 3s
      retries: 5
      timeout: 5s