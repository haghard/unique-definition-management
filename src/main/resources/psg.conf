pekko.persistence.journal.plugin = "pekko.persistence.r2dbc.journal"
pekko.persistence.snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
#pekko.persistence.state.plugin = "pekko.persistence.r2dbc.state"


pekko.persistence.r2dbc.query.refresh-interval = 1s

pekko.projection.r2dbc.dialect=postgres

pekko.persistence.r2dbc.connection-factory = ${pekko.persistence.r2dbc.postgres}

pekko.persistence.r2dbc {

  postgres {
    dialect = "postgres"
    driver = "postgres"

    // #connection-settings-postgres
    # the connection can be configured with a url, eg: "r2dbc:postgresql://<host>:5432/<database>"
    //url = ""
    //r2dbc:postgresql:failover://user:foo@host1:5433,host2:5432,host3?targetServerType=primary.
    //https://github.com/pgjdbc/r2dbc-postgresql

    //r2dbc:postgresql://<host>[:<port>]/<database>[?option=value]

    //url = "r2dbc:postgresql://localhost:5432/cas"

      //"r2dbc:postgresql:failover://user:postgres@localhost:5433"

    //"r2dbc:postgresql://<host>:5432/<database>"

    # The connection options to be used. Ignored if 'url' is non-empty
    host = "localhost"
    port = 5432
    database = "cas"
    user = "postgres"
    password = "postgres"
    // #connection-settings-postgres

    ssl {
      enabled = off
      # See PostgresqlConnectionFactoryProvider.SSL_MODE
      # Possible values:
      #  allow - encryption if the server insists on it
      #  prefer - encryption if the server supports it
      #  require - encryption enabled and required, but trust network to connect to the right server
      #  verify-ca - encryption enabled and required, and verify server certificate
      #  verify-full - encryption enabled and required, and verify server certificate and hostname
      #  tunnel - use a SSL tunnel instead of following Postgres SSL handshake protocol
      mode = ""

      # Server root certificate. Can point to either a resource within the classpath or a file.
      root-cert = ""

      # Client certificate. Can point to either a resource within the classpath or a file.
      cert = ""

      # Key for client certificate. Can point to either a resource within the classpath or a file.
      key = ""

      # Password for client key.
      password = ""
    }

    # Maximum time to create a new connection.
    connect-timeout = 2 seconds

    # Configures the statement cache size.
    # 0 means no cache, negative values will select an unbounded cache
    # a positive value will configure a bounded cache with the passed size.
    statement-cache-size = 5000

    # Abort any statement that takes more than the specified amount of time.
    # This timeout is handled by the database server.
    # This timeout should be less than `close-calls-exceeding`.
    statement-timeout = off

    # Possibility to programatically amend the ConnectionFactoryOptions.
    # Enable by specifying the fully qualified class name of a
    # `akka.persistence.r2dbc.ConnectionFactoryProvider.ConnectionFactoryOptionsProvider`.
    # The class can optionally have a constructor with an ActorSystem parameter.
    options-provider = ""
  }

  journal {
    class = "org.apache.pekko.persistence.r2dbc.journal.R2dbcJournal"

    # name of the table to use for events
    table = "event_journal"

    # Otherwise it would be a pinned dispatcher, see https://github.com/akka/akka/issues/31058
    plugin-dispatcher = "pekko.actor.default-dispatcher"

    # Enable this to reduce latency of eventsBySlices. The persisted events will be
    # published as Pekko messages and consumed directly by running eventsBySlices
    # queries. Tradeoff is more CPU and network resources that are used. The events
    # must still be retrieved from the database, but at a lower polling frequency,
    # because delivery of published messages are not guaranteed.
    publish-events = off

    publish-events-dynamic.throughput-threshold = 300
  }
  query {
    # Note that this can probably be decreased if we can use db time, see use-app-timestamp.
    #behind-current-time = 500 millis
    # refresh-interval = 20 seconds
  }

  # We trust that system time will not move backward for two subsequent persists from the same entity.
  # See also https://github.com/yugabyte/yugabyte-db/issues/10996
  db-timestamp-monotonic-increasing = on

  # Workaround of https://github.com/yugabyte/yugabyte-db/issues/10995
  # FIXME: This property should be removed when the Yugabyte issue has been resolved.
  # Note that query.behind-current-time can probably be decreased if we can use db time.
  use-app-timestamp = on

}

pekko {

  #https://pekko.apache.org/docs/pekko-projection/current/projection-settings.html
  projection {

    # The configuration to use to restart the projection after an underlying streams failure
    # The Pekko streams restart source is used to facilitate this behaviour
    # See the streams documentation for more details
    # https://pekko.apache.org/docs/pekko/current/stream/stream-error.html#delayed-restarts-with-a-backoff-operator
    restart-backoff {
      min-backoff = 1s
      max-backoff = 5s
      random-factor = 0.2

      # -1 will not cap the amount of restarts
      # 0 will disable restarts
      max-restarts = -1
    }


    r2dbc {
      offset-store {
        # only timestamp based offsets
        offset-table = ""
      }
    }
  }
}
