jdbc-journal {
  slick = ${akka-persistence-jdbc.shared-databases.slick}
}

# the akka-persistence-snapshot-store in use
jdbc-snapshot-store {
  slick = ${akka-persistence-jdbc.shared-databases.slick}
}

# the akka-persistence-query provider in use
jdbc-read-journal {
  slick = ${akka-persistence-jdbc.shared-databases.slick}
}

# the akka-persistence-jdbc provider in use for durable state store
jdbc-durable-state-store {
  slick = ${akka-persistence-jdbc.shared-databases.slick}
}

akka-persistence-jdbc {
  shared-databases {
    slick {
      socket-timeout = 3000
      profile = "slick.jdbc.PostgresProfile$"
      dataSourceClass = "slick.jdbc.DatabaseUrlDataSource"

      host = "localhost"
      host = ${?DB_HOST}

      db {
        url = "jdbc:postgresql://"${akka-persistence-jdbc.shared-databases.slick.host}":5432/assets?reWriteBatchedInserts=true"
        user = ${psg.properties.user}
        password = ${psg.properties.password}
        driver = "org.postgresql.Driver"
        numThreads = 5
        maxConnections = 5
        minConnections = 5
        transactionIsolation = REPEATABLE_READ
      }
    }
  }
}

psg = {
  connectionPool = "HikariCP"
  dataSourceClass = "slick.jdbc.DatabaseUrlDataSource"

  #BEGIN TRANSACTION ISOLATION LEVEL READ COMMITTED;
  #BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ;
  #BEGIN TRANSACTION ISOLATION LEVEL SERIALIZABLE;

  #G2-item: Item Anti-dependency Cycles (write skew on disjoint read),
  #G2: Anti-Dependency Cycles (write skew on predicate read)
  transactionIsolation = REPEATABLE_READ

  properties = {
    serverName = ${akka-persistence-jdbc.shared-databases.slick.host}
    portNumber = "5432"
    databaseName = "assets"
    user = "postgres"
    password = "postgres"
  }
  numThreads = 5
}
