syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

import "scalapb/scalapb.proto";
import "domain/domain.proto";

option java_multiple_files = true;
option java_package = "com.definition.domain.event";

package com.definition.domain.events;

option (scalapb.options) = {
  lenses: true,
  preserve_unknown_fields: false,
  no_default_values_in_constructor: false,
  no_primitive_wrappers: true,
  single_file: true,
  preamble: "sealed trait Event extends scalapb.GeneratedMessage",
};

message Acquired {
  option (scalapb.message).extends = "Event";
  string owner_id = 1;
  DefinitionLocation location = 2 [(scalapb.field).no_box = true];
  DefinitionLocation prev_location = 3;
}

message Released {
  option (scalapb.message).extends = "Event";
  string owner_id = 1;
  DefinitionLocation new_location = 2 [(scalapb.field).no_box = true];
  //DefinitionLocation prev_location = 3 [(scalapb.field).no_box = true];
}
