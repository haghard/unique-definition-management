syntax = "proto3";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

import "scalapb/scalapb.proto";

option java_multiple_files = true;
option java_package = "com.definition.domain";

package com.definition.domain;

message TakenDefinitionState {
  //map<string, int64> contentKeySeqNum=1;
  optional string owner_id = 1;
  //repeated string content = 1 [(scalapb.field).collection_type = "scala.collection.immutable.Set" ];
}

message Definition {
  string name = 1;
  string address = 2;
  string city = 3;
  string country = 4;
  optional string state = 5;
  optional string zipCode = 6;
  optional string brand = 7;
}

message DefinitionLocation {
  int32 shard_id = 1;
  int64 definition_id = 2;
}
