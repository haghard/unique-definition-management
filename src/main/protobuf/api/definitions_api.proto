syntax = "proto3";

import "google/protobuf/timestamp.proto";

import "scalapb/scalapb.proto";
import "domain/domain.proto";

option java_multiple_files = true;
option java_package = "com.definition.api";

package com.definition.api;

option (scalapb.options) = {
  lenses: true,
  preserve_unknown_fields: false,
  retain_source_code_info: true,
  no_primitive_wrappers: true,
  no_default_values_in_constructor: true,
  single_file: true,
};

service DefinitionService {
  rpc ConditionalPut(PutRequest) returns (PutReply) {}
  rpc GetDefinitionLocation(GetDefinitionLocationRequest) returns (GetDefinitionLocationReply) {}
}

message GetDefinitionLocationRequest {
  string owner_id = 1;
}

message GetDefinitionLocationReply {
  com.definition.domain.DefinitionLocation location = 1;
  com.definition.domain.Definition definition = 2;
}

message PutRequest {
  string owner_id = 1;
  com.definition.domain.Definition definition = 2 [(scalapb.field).no_box = true];
  com.definition.domain.DefinitionLocation location = 3;
}

message PutReply {
  string owner_id = 1;
  StatusCode status_code = 2;
  com.definition.domain.DefinitionLocation location = 3 [(scalapb.field).no_box = true];

  enum StatusCode {
    Undefined = 0;
    OK = 1;
    OKNoOp = 2;
    OwnerReserved = 3;
    Reserved = 4;
    OwnerNotFound = 5;
    LocationNotFound = 6;
    AnotherDefinitionFound = 7;
    ConcurrentModification = 8;
    UpdateFailure = 9;
  }
}
