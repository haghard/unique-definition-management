syntax = "proto3";

import "google/protobuf/timestamp.proto";

import "scalapb/scalapb.proto";
import "domain/domain.proto";

option java_multiple_files = true;
option java_package = "com.definition.api";

package com.definition.api;

option (scalapb.options) = {
  lenses: true,
  preserve_unknown_fields: false,
  retain_source_code_info: true,
  no_primitive_wrappers: true,
  no_default_values_in_constructor: true,
  single_file: true,
};

service DefinitionService {
  rpc ConditionalPut(PutRequest) returns (PutReply) {}
  rpc GetCausalToken(GetCausalTokenRequest) returns (GetCausalTokenReply) {}
}

message GetCausalTokenRequest {
  string owner_id = 1;
}

message GetCausalTokenReply {
  int64 causal_token = 3;
}

message PutRequest {
  string owner_id = 1;
  com.definition.domain.Definition definition = 2 [(scalapb.field).no_box = true];
  int64 causal_token = 3;
}



message PutReply {
  string owner_id = 1;
  StatusCode status_code = 2;
  int64 causal_token = 3;
  //com.definition.domain.DefinitionLocation definition_location = 3 [(scalapb.field).no_box = true];

  enum StatusCode {
    Undefined = 0;
    OK = 1;
    OK2 = 2;
    Reserved = 3;
    NotFound = 4;
    IllegalState = 5;
    WrongCausalToken = 6;
    CausalTokenNotFound=7;
    AnotherDefinitionFound = 8;
    InvalidCausalToken=9;
    ConcurrentAccess=10;
  }
}
